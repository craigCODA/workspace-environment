name: windows-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Node dependencies
        if: ${{ hashFiles('package.json') != '' }}
        shell: pwsh
        run: npm install

      - name: Test TypeScript workspaces
        if: ${{ hashFiles('package.json') != '' }}
        shell: pwsh
        run: npm test

      - name: Typecheck TypeScript workspaces
        if: ${{ hashFiles('package.json') != '' }}
        shell: pwsh
        run: npm run typecheck --workspaces --if-present

      - name: Setup .NET 8
        if: ${{ hashFiles('apps/host-windows/Workspace.Host.sln') != '' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test Windows host
        if: ${{ hashFiles('apps/host-windows/Workspace.Host.sln') != '' }}
        shell: pwsh
        run: dotnet test apps/host-windows/Workspace.Host.sln --configuration Release

      - name: Test native Coda core
        shell: pwsh
        run: npm run native:test

      - name: Build native Windows preview
        shell: pwsh
        run: npm run native:build

      - name: Stage native Windows bundle
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/stage-native-artifact.ps1 -OutputRoot .native-package

      - name: Upload native Coda bundle
        uses: actions/upload-artifact@v4
        with:
          name: workspace-environment-native-coda
          path: .native-package/**
          if-no-files-found: error

      - name: Build Electron fallback installer
        shell: pwsh
        run: npm run dist:win

      - name: Upload Electron fallback installer
        uses: actions/upload-artifact@v4
        with:
          name: workspace-environment-electron-fallback
          path: dist/Workspace Environment Setup 0.1.0.exe
          if-no-files-found: error
