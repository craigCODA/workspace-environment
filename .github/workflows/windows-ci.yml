name: windows-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        if: ${{ hashFiles('package.json') != '' }}
        shell: pwsh
        run: npm install

      - name: Test TypeScript workspaces
        if: ${{ hashFiles('package.json') != '' }}
        shell: pwsh
        run: npm test --workspaces --if-present

      - name: Typecheck TypeScript workspaces
        if: ${{ hashFiles('package.json') != '' }}
        shell: pwsh
        run: npm run typecheck --workspaces --if-present

      - name: Setup .NET 8
        if: ${{ hashFiles('apps/host-windows/Workspace.Host.sln') != '' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test Windows host
        if: ${{ hashFiles('apps/host-windows/Workspace.Host.sln') != '' }}
        shell: pwsh
        run: dotnet test apps/host-windows/Workspace.Host.sln --configuration Release
